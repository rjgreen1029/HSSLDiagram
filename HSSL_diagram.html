<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Healthy Social Systems Lab — Interactive Map</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #ffffff;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  padding: 32px 16px;
}

.card {
  position: relative;
  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
}

.diagram-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1920 / 1800; /* reserves correct space even before images load */
}

.diagram-wrap img.bg {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

/* Icon buttons -- position is set per-icon below, sized as a % of the
   1920x1800 diagram so it scales responsively with the container. */
.icon-btn {
  position: absolute;
  display: block;
  padding: 0;
  border: 0;
  background: none;
  transition: transform 0.25s ease, filter 0.25s ease;
  cursor: pointer;
}

.icon-btn img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.icon-btn:hover {
  transform: scale(1.14);
  filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
  z-index: 10;
}

/* Accessible focus state for keyboard users. */
.icon-btn:focus-visible {
  transform: scale(1.14);
  filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.4));
  outline: 3px solid #2563eb;
  outline-offset: 4px;
  border-radius: 8px;
  z-index: 10;
}

.icon-btn:active {
  transform: scale(1.06);
}

/* Placement for each topic, derived from the reference layout. */
#node-social     { left: 36.667%; top: 4.393%;  width: 18.750%; }
#node-places     { left: 1.771%;  top: 24.541%; width: 18.750%; }
#node-economy    { left: 68.750%; top: 15.991%; width: 18.750%; }
#node-healthcare { left: 72.917%; top: 65.895%; width: 18.750%; }
#node-climate    { left: 24.323%; top: 66.534%; width: 18.750%; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.footer-row {
  padding: 14px 22px 20px;
  font-size: 12.5px;
  color: #666;
  text-align: right;
}

</style>
</head>
